<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3: Purpose, Priorities and Professional Development</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── THEME TOKENS ─────────────────────────────────────── */
  :root {
    --navy:       #1a2744;
    --navy-mid:   #2c3e6b;
    --gold:       #c9a84c;
    --gold-light: #f0e6c8;
    --cream:      #f5f0e8;
    --cream-dark: #ede8dc;
    --border:     #d4c9b0;
    --text:       #2c2416;
    --text-muted: #5a5040;
    --text-dim:   #7a6e5e;
  }

  /* ── RESET ────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

  /* ── PAGE HEADER ──────────────────────────────────────── */
  .page-header { background: var(--navy); border-bottom: 3px solid var(--gold); padding: 24px 28px 0; }
  .container   { max-width: 960px; margin: 0 auto; }
  .header-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; font-weight: 500; text-align: center; }
  h1 { font-family: 'Playfair Display', serif; color: #fff; text-align: center; margin-bottom: 4px; font-size: 24px; font-weight: 700; }
  .subtitle { color: rgba(255,255,255,0.65); text-align: center; margin-bottom: 14px; font-size: 13px; }

  /* ── NAV PILLS ────────────────────────────────────────── */
  .nav-container { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0 12px; }
  .nav-item { padding: 7px 13px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); border: 1.5px solid transparent; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,0.18); transform: translateY(-1px); }
  .nav-item.active { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  .nav-number { font-size: 11px; opacity: 0.8; }
  .nav-item.active .nav-number { opacity: 1; }

  /* ── CONTENT AREA & CARD ──────────────────────────────── */
  .content-area { padding: 24px 28px 40px; }
  .card { background: #fff; border-radius: 12px; padding: 26px; border: 1px solid var(--border); min-height: 520px; }

  /* ── SECTION HEADER ───────────────────────────────────── */
  .section-number   { display: inline-block; background: var(--navy); color: var(--gold); padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; margin-right: 10px; vertical-align: middle; }
  .section-title    { display: inline; font-size: 22px; font-weight: 600; color: var(--navy); vertical-align: middle; }
  .section-subtitle { display: block; font-size: 13px; color: var(--text-muted); margin-top: 12px; margin-bottom: 20px; line-height: 1.6; border-left: 3px solid var(--gold); padding: 10px 14px; background: var(--cream-dark); border-radius: 0 6px 6px 0; }
  .subsection { margin: 20px 0; }
  .subsection-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .subsection-title::before { content: ''; width: 3px; height: 16px; background: var(--gold); border-radius: 2px; flex-shrink: 0; }

  /* ── CLICKABLE GRID ───────────────────────────────────── */
  .clickable-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0; }
  .clickable-item { padding: 16px; border-radius: 10px; cursor: pointer; transition: all 0.25s; text-align: center; border: 2px solid transparent; }
  .clickable-item:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(26,39,68,0.12); }
  .clickable-item.active { border-color: var(--gold); box-shadow: 0 6px 18px rgba(201,168,76,0.25); }
  .clickable-icon { font-size: 30px; margin-bottom: 8px; }
  .clickable-name { font-weight: 700; font-size: 13px; color: var(--text); }
  .clickable-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .item-blue   { background: #dbeafe; }
  .item-green  { background: #dcfce7; }
  .item-yellow { background: #fef3c7; }
  .item-red    { background: #fee2e2; }
  .item-purple { background: #ede9fe; }
  .item-orange { background: #ffedd5; }
  .item-teal   { background: #ccfbf1; }
  .item-gray   { background: #f1f5f9; }

  /* ── DETAIL BOX ───────────────────────────────────────── */
  .detail-box { margin-top: 14px; padding: 18px; background: #fff; border-radius: 8px; border: 1px solid var(--border); border-left: 3px solid var(--gold); }
  .detail-box h4 { color: var(--navy); margin-bottom: 8px; font-size: 15px; font-weight: 700; }
  .detail-box p  { color: #4a3f2f; line-height: 1.6; margin-bottom: 8px; font-size: 13.5px; }
  .detail-box p:last-child { margin-bottom: 0; }

  /* ── INSIGHT / CALLOUT BOX ────────────────────────────── */
  .insight-box { background: var(--gold-light); border: 1px solid var(--gold); border-radius: 8px; padding: 14px 16px; margin: 16px 0; }
  .insight-title { font-size: 12px; font-weight: 700; color: #7a5c00; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .insight-box p { color: #5c4400; font-size: 13.5px; line-height: 1.5; }

  /* ── CULTURAL / INFO NOTE BOX ─────────────────────────── */
  .info-note { background: #e8edf5; border: 1px solid #b5c4d4; border-radius: 8px; padding: 14px 16px; margin: 16px 0; }
  .info-note .note-title { font-weight: 700; color: var(--navy); margin-bottom: 8px; font-size: 13px; }
  .info-note p { color: #2c3e6b; font-size: 13.5px; line-height: 1.5; }
  .info-note p + p { margin-top: 8px; }

  /* ── FORMULA BOX ──────────────────────────────────────── */
  .formula-box   { background: var(--gold-light); border: 1.5px solid var(--gold); border-radius: 10px; padding: 18px; margin: 16px 0; }
  .formula-title { font-weight: 700; margin-bottom: 12px; text-align: center; color: #7a5c00; font-size: 14px; }
  .formula-steps { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
  .formula-step  { background: white; padding: 9px 13px; border-radius: 7px; font-weight: 600; font-size: 13px; border: 1px solid var(--border); color: var(--text); }
  .formula-arrow { color: var(--gold); font-size: 16px; font-weight: bold; }
  .formula-note  { text-align: center; margin-top: 12px; font-size: 13px; color: #7a5c00; font-weight: 600; }

  /* ── NUMBERED STEPS LIST ──────────────────────────────── */
  .steps-list  { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 16px 0; }
  .step-item   { display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: #fff; border-radius: 8px; border: 1px solid var(--border); border-left: 3px solid var(--navy); }
  .step-number { background: var(--navy); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .step-text   { font-size: 13px; color: #4a3f2f; }

  /* ── CIRCLE-NUMBER STEP LIST (vertical) ──────────────── */
  .vsteps { display: flex; flex-direction: column; gap: 16px; margin: 16px 0; }
  .vstep  { display: flex; gap: 20px; align-items: flex-start; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; transition: box-shadow 0.2s; }
  .vstep:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .vstep-num  { width: 38px; height: 38px; background: var(--navy); color: white; font-size: 18px; font-weight: 700; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .vstep-body h4 { font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  .vstep-body p  { font-size: 13.5px; color: #6b6b6b; line-height: 1.6; }

  /* ── EXPANDABLE CARDS ─────────────────────────────────── */
  .exp-cards { display: grid; gap: 12px; }
  .cols-2 { grid-template-columns: 1fr 1fr; }
  .cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .exp-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .exp-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--navy); opacity: 0; transition: opacity 0.2s; }
  .exp-card:hover { border-color: #b8a98a; transform: translateY(-2px); }
  .exp-card:hover::before, .exp-card.expanded::before { opacity: 1; }
  .exp-card.expanded { border-color: var(--gold); background: #fdfaf5; }
  .exp-title   { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .exp-tag     { font-size: 10px; background: var(--gold-light); color: #7a5c00; padding: 2px 7px; border-radius: 10px; font-weight: 600; margin-left: auto; flex-shrink: 0; }
  .exp-preview { font-size: 12px; color: var(--text-dim); line-height: 1.45; }
  .exp-detail  { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--cream-dark); }
  .exp-card.expanded .exp-detail { display: block; }
  .dp { display: flex; gap: 8px; margin-bottom: 7px; font-size: 12px; color: #4a3f2f; line-height: 1.45; }
  .dp::before { content: '→'; color: var(--gold); flex-shrink: 0; font-weight: 700; }
  .expand-hint { font-size: 11px; color: #b8a98a; margin-top: 8px; text-align: right; }
  .exp-card:hover .expand-hint { color: #7a5c00; }

  /* ── PULL QUOTE ───────────────────────────────────────── */
  .pullquote { background: var(--navy); color: white; border-radius: 12px; padding: 28px 32px; margin: 24px 0; position: relative; }
  .pullquote::before { content: '\201C'; font-family: 'Playfair Display', serif; font-size: 100px; color: var(--gold); opacity: 0.3; position: absolute; top: -10px; left: 16px; line-height: 1; }
  .pullquote p    { font-size: 15px; line-height: 1.65; font-weight: 400; position: relative; z-index: 1; }
  .pullquote cite { display: block; margin-top: 10px; font-size: 12px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; font-style: normal; font-weight: 500; position: relative; z-index: 1; }

  /* ── STAT BOXES ───────────────────────────────────────── */
  .stats    { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin: 20px 0; }
  .stat-box { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 24px 20px; text-align: center; }
  .stat-num   { font-size: 42px; font-weight: 700; color: var(--navy); line-height: 1; margin-bottom: 8px; }
  .stat-label { font-size: 13px; color: #6b6b6b; line-height: 1.5; }

  /* ── COMPARE COLUMNS ──────────────────────────────────── */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .c-col   { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .c-col h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--cream-dark); }
  .c-row { display: block; margin-bottom: 7px; font-size: 12px; color: var(--text-muted); line-height: 1.45; }

  /* ── VISION BANNER ────────────────────────────────────── */
  .vision-banner { text-align: center; padding: 13px; background: var(--navy); color: white; border-radius: 8px; font-weight: 700; font-size: 13px; margin-bottom: 12px; }

  /* ── COVEY QUADRANT GRID ──────────────────────────────── */
  .matrix-wrap { display: grid; grid-template-columns: 34px 1fr 1fr; grid-template-rows: auto auto 26px; gap: 8px; margin: 16px 0; align-items: stretch; }
  .axis-y { grid-row: 1 / span 2; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy); background: var(--cream-dark); border-radius: 6px; padding: 6px 0; }
  .axis-x { grid-column: 2 / span 2; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy); background: var(--cream-dark); border-radius: 6px; padding: 6px 0; }
  .quad { border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: all 0.25s; border: 2px solid transparent; color: var(--text); min-height: 118px; }
  .quad:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(26,39,68,0.12); }
  .quad.active { border-color: var(--gold); box-shadow: 0 6px 18px rgba(201,168,76,0.25); }
  .quad-mark { font-size: 20px; float: right; line-height: 1; opacity: 0.75; }
  .quad-cond { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
  .quad-name { font-size: 15px; font-weight: 700; margin: 4px 0 6px; color: var(--navy); }
  .quad-list { font-size: 11.5px; line-height: 1.5; color: var(--text-muted); }
  .q1 { background: #fee2e2; }
  .q2 { background: #dcfce7; }
  .q3 { background: #fef3c7; }
  .q4 { background: #f1f5f9; }

  /* ── VENN DIAGRAM ─────────────────────────────────────── */
  .venn-wrap { display: flex; justify-content: center; margin: 8px 0 4px; }
  .venn { width: 100%; max-width: 430px; height: auto; }
  .venn-region { cursor: pointer; transition: opacity 0.2s; opacity: 0.72; }
  .venn-region:hover { opacity: 0.92; }
  .venn-region.active { opacity: 1; }
  .venn-outline { fill: none; stroke: var(--navy); stroke-width: 1.5; opacity: 0.35; pointer-events: none; }
  .venn-ring { fill: none; stroke: var(--gold); stroke-width: 3; pointer-events: none; }
  .venn-circle-label { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: var(--navy); letter-spacing: 0.1em; text-anchor: middle; pointer-events: none; }
  .venn-feel { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; fill: #3a3020; text-anchor: middle; pointer-events: none; }
  .venn-feel.active { font-size: 11px; font-weight: 700; fill: var(--navy); }
  .venn-hint { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-bottom: 10px; }

  /* ── SIMPLE TABLE ─────────────────────────────────────── */
  .stbl { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 12.5px; }
  .stbl th { background: var(--navy); color: var(--gold); text-align: left; padding: 9px 11px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
  .stbl td { padding: 9px 11px; border-bottom: 1px solid var(--cream-dark); color: #4a3f2f; line-height: 1.45; vertical-align: top; }
  .stbl tr:last-child td { border-bottom: none; }
  .stbl tr.hl td { background: var(--gold-light); font-weight: 700; color: #5c4400; }

  /* ── QUIZ ─────────────────────────────────────────────── */
  .quiz-progress { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
  .quiz-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
  .quiz-dot.active    { background: var(--navy); transform: scale(1.3); }
  .quiz-dot.correct   { background: var(--gold); }
  .quiz-dot.incorrect { background: #c07060; }
  .quiz-question { font-size: 17px; font-weight: 700; margin-bottom: 18px; color: var(--navy); line-height: 1.4; }
  .quiz-options  { display: flex; flex-direction: column; gap: 10px; }
  .quiz-option   { padding: 13px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; border: 1.5px solid var(--border); background: white; font-size: 13.5px; color: var(--text); }
  .quiz-option:hover:not(.disabled) { border-color: var(--navy); background: var(--cream); transform: translateX(3px); }
  .quiz-option.correct  { border-color: var(--gold); background: var(--gold-light); color: #5c4400; }
  .quiz-option.incorrect { border-color: #c07060; background: #f5e8e5; color: #6b2a1e; }
  .quiz-option.disabled { cursor: default; }
  .quiz-feedback { margin-top: 14px; padding: 14px 16px; border-radius: 8px; font-size: 13.5px; line-height: 1.5; }
  .quiz-feedback.correct   { background: var(--gold-light); color: #5c4400; border: 1px solid var(--gold); }
  .quiz-feedback.incorrect { background: #f5e8e5; color: #6b2a1e; border: 1px solid #c07060; }
  .quiz-nav { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
  .quiz-btn { padding: 11px 22px; border-radius: 8px; cursor: pointer; font-weight: 700; border: none; transition: all 0.2s; font-size: 13.5px; }
  .quiz-btn:hover { transform: translateY(-1px); }
  .quiz-btn-primary   { background: var(--navy); color: var(--gold); }
  .quiz-btn-secondary { background: var(--cream-dark); color: var(--navy); }
  .quiz-result  { text-align: center; padding: 30px 20px; }
  .quiz-score   { font-size: 64px; margin: 16px 0; }
  .quiz-message { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; }

  @media (max-width: 700px) {
    .compare, .cols-2, .cols-3 { grid-template-columns: 1fr; }
    .matrix-wrap { grid-template-columns: 28px 1fr; grid-template-rows: auto auto auto auto 26px; }
    .axis-y { grid-row: 1 / span 4; }
    .axis-x { grid-column: 2; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     PAGE HEADER
     ═══════════════════════════════════════════ -->
<div class="page-header">
  <div class="container">
    <div class="header-label">Executive Ready Leadership · Module 3</div>
    <h1>Purpose, Priorities &amp; Professional Development</h1>
    <p class="subtitle">What am I committing to do in order to be the leader I want to be?</p>
    <div class="nav-container" id="nav"></div>
  </div>
</div>

<div class="content-area">
  <div class="container">
    <div class="card" id="content"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   STEP 1 — Sections
   ═══════════════════════════════════════════════════════════ */
const sections = [
  { id: '3.1', name: 'The Third Space',    icon: '🌗' },
  { id: '3.2', name: 'The Sweet Spot',     icon: '🎯' },
  { id: '3.3', name: 'Vision & Tension',   icon: '🧭' },
  { id: '3.4', name: 'Managing Priorities',icon: '🗂️' },
  { id: '3.5', name: 'GROW Coaching',      icon: '🌱' },
  { id: '3.6', name: 'Project & Commitments', icon: '📋' },
  { id: 'quiz', name: 'Quiz',              icon: '🧠' }
];

/* ═══════════════════════════════════════════════════════════
   STEP 2 — State
   ═══════════════════════════════════════════════════════════ */
const state = {
  currentSection: sections[0].id,
  selectedSpace:    0,
  selectedCircle:   0,
  selectedPosition: 0,
  selectedQuadrant: 1,
  selectedGrow:     0,
  quiz:           0,
  quizAnswers:    [],
  quizComplete:   false
};

/* ═══════════════════════════════════════════════════════════
   STEP 3 — Quiz questions
   ═══════════════════════════════════════════════════════════ */
const quizQuestions = [
  {
    q: 'In the Covey Matrix, how is an "important" activity defined?',
    opts: [
      'An activity that demands immediate attention',
      'An activity with outcomes that lead to the achievement of your goals',
      'An activity your manager has asked you to do',
      'An activity with a hard deadline attached'
    ],
    correct: 1,
    explain: 'Important activities have outcomes that lead to the achievement of YOUR goals. Urgent activities demand immediate attention and are often associated with the achievement of someone else’s goals.'
  },
  {
    q: 'Which Covey quadrant is called "The Zone", and is the one you are challenged to grow?',
    opts: [
      'Quadrant I: Urgent and Important',
      'Quadrant II: Not Urgent and Important',
      'Quadrant III: Urgent and Not Important',
      'Quadrant IV: Not Urgent and Not Important'
    ],
    correct: 1,
    explain: 'Quadrant II, Not Urgent and Important, is The Zone: planning, prevention, relationship building, new opportunities, learning and development. The challenge is to create as much time as possible for this quadrant. This is being proactive.'
  },
  {
    q: 'According to the Sweet Spot model, what does it feel like when you are using only your gifts?',
    opts: ['Self-indulgent', 'Disengaged', 'Frustration', 'Unappreciated'],
    correct: 2,
    explain: 'Using gifts alone brings frustration: you keep getting pulled back to what you are good at without tapping into your sense of purpose or passion. Passion alone feels self-indulgent; purpose alone feels self-sacrificing.'
  },
  {
    q: 'What is the formula for building a purpose statement, from The Purpose Project?',
    opts: [
      'Vision + values + mission',
      'Verb + intention (what) + outcome (beneficiary)',
      'Gifts + passion + purpose',
      'Goal + reality + options'
    ],
    correct: 1,
    explain: 'Purpose = verb + intention (what) + outcome (beneficiary). For example, "To create a brilliant connected future for everyone".'
  },
  {
    q: 'Creative tension requires two things. What are they?',
    opts: [
      'A deadline and an accountability partner',
      'A vision of what you want, and a clear honest understanding of current reality',
      'A stretch goal and a fallback plan',
      'Ambition and permission'
    ],
    correct: 1,
    explain: 'A vision without the current reality is really just a dream. The current reality without a vision is just stuck, complacent, or coasting. The gap between the two is the source of energy.'
  },
  {
    q: 'What does neuroscience research say actually happens when we think we are multitasking?',
    opts: [
      'The brain genuinely processes two tasks in parallel',
      'We switch tasks quickly, with a stop/start process each time',
      'Performance improves on simple tasks but not complex ones',
      'The brain allocates equal attention to each task'
    ],
    correct: 1,
    explain: 'The brain does not do tasks simultaneously. We switch-task. That start/stop/start process costs time rather than saving it, produces more mistakes, and saps energy.'
  },
  {
    q: 'In the GROW model, what is the coach doing during the "Options" stage?',
    opts: [

/* Venn geometry: Purpose top (P), Gifts bottom-left (G), Passion bottom-right (S) */
function renderVenn() {
  const sel = state.selectedPosition;
  // region index -> [clip chain of circle ids, exclusion circle ids]
  const regions = [
    { i: 0, clip: ['G'],           not: ['P','S'] },
    { i: 1, clip: ['S'],           not: ['P','G'] },
    { i: 2, clip: ['P'],           not: ['G','S'] },
    { i: 3, clip: ['P','S'],       not: ['G']     },
    { i: 4, clip: ['G','S'],       not: ['P']     },
    { i: 5, clip: ['P','G'],       not: ['S']     },
    { i: 6, clip: ['P','G','S'],   not: []        }
  ];
  const shapes = regions.map(r => {
    const p = positions[r.i];
    const maskId = 'mask-' + r.i;
    let inner = `<rect x="0" y="0" width="400" height="360" fill="${p.fill}" ${r.not.length ? `mask="url(#${maskId})"` : ''}/>`;
    for (let k = r.clip.length - 1; k >= 0; k--) inner = `<g clip-path="url(#clip${r.clip[k]})">${inner}</g>`;
    return `<g class="venn-region ${r.i === sel ? 'active' : ''}" onclick="selectPosition(${r.i})"
              role="button" tabindex="0" aria-label="${p.name}: ${p.feel}">${inner}</g>`;
  }).join('');

  const masks = regions.filter(r => r.not.length).map(r => `
    <mask id="mask-${r.i}">
      <rect x="0" y="0" width="400" height="360" fill="white"/>
      ${r.not.map(n => `<use href="#c${n}" fill="black"/>`).join('')}
    </mask>`).join('');

  const labels = positions.map((p, i) => `
    <text class="venn-feel ${i === sel ? 'active' : ''}" x="${p.at[0]}" y="${p.at[1]}">${p.feel}</text>`).join('');

  return `
  <div class="venn-wrap">
    <svg class="venn" viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <circle id="cP" cx="200" cy="150" r="100"/>
        <circle id="cG" cx="145" cy="240" r="100"/>
        <circle id="cS" cx="255" cy="240" r="100"/>
        <clipPath id="clipP"><use href="#cP"/></clipPath>
        <clipPath id="clipG"><use href="#cG"/></clipPath>
        <clipPath id="clipS"><use href="#cS"/></clipPath>
        ${masks}
      </defs>
      ${shapes}
      <use href="#cP" class="venn-outline"/>
      <use href="#cG" class="venn-outline"/>
      <use href="#cS" class="venn-outline"/>
      <text class="venn-circle-label" x="200" y="58">PURPOSE</text>
      <text class="venn-circle-label" x="70"  y="330">GIFTS</text>
      <text class="venn-circle-label" x="330" y="330">PASSION</text>
      ${labels}
    </svg>
  </div>
  <div class="venn-hint">Click any region of the diagram to read what that position feels like.</div>`;
}

      <div class="steps-list">
        <div class="step-item"><div class="step-number">1</div><div class="step-text">Is this really a necessary task?</div></div>
        <div class="step-item"><div class="step-number">2</div><div class="step-text">Am I spending my time in “fire fighting” mode?</div></div>
        <div class="step-item"><div class="step-number">3</div><div class="step-text">Do I work on band-aid fixes rather than looking at the cause of problems?</div></div>
        <div class="step-item"><div class="step-number">4</div><div class="step-text">Do I feel guilty taking time out for myself?</div></div>
        <div class="step-item"><div class="step-number">5</div><div class="step-text">Do I put off tasks I know are important but that may be perceived as time wasting?</div></div>
        <div class="step-item"><div class="step-number">6</div><div class="step-text">Am I saying yes to other people’s work because they cannot manage their own tasks?</div></div>
        <div class="step-item"><div class="step-number">7</div><div class="step-text">Am I working on activities because they are enjoyable rather than because they make a difference?</div></div>
      </div>
    </div>

    <div class="subsection">
      <div class="subsection-title">A worked example of moving a task</div>
      <p style="font-size:13.5px;color:#4a3f2f;line-height:1.6;">A business spent two weeks every quarter hand-stuffing catalogues into envelopes. It consumed enormous time, felt urgent, and generated very little response: <strong>urgent and not important</strong>. When email arrived, the same content went out with a link back, response rates rose sharply, and the activity became <strong>not urgent and important</strong>, a major feature of how they did business.</p>
      <p style="font-size:13.5px;color:#4a3f2f;line-height:1.6;margin-top:10px;">A smaller version of the same move: coming home tonight is neither urgent nor important. Coming home <em>with flowers</em> moves it up into important.</p>
    </div>

    <div class="insight-box">
      <div class="insight-title">🧠 The myth of multitasking</div>
      <p>The brain does not do tasks simultaneously. We <strong>switch-task</strong>, with a stop/start process each time. Rather than saving time it costs time, produces more mistakes, and saps energy. Test it: time yourself writing “I am a great multitasker” then 1 to 20 (about 20 seconds), then time yourself alternating one letter, one number, line to line. Expect double or more, with errors. Instead: set a time limit, 10 or 45 minutes, and focus on one task.</p>
    </div>

    <div class="info-note">
      <div class="note-title">📊 Australian context: HILDA Statistical Report 2021</div>
      <p>Women consistently report higher time stress than men, by about 7 to 8 percentage points. In 2019, 38% of women reported often or almost always feeling rushed or pressed for time, versus 29% of men. The 35 to 44 age group is highest, with almost half consistently in time stress.</p>
      <p>Holding a Bachelor’s degree or higher is associated with an 11.1 (women) and 10.0 (men) percentage point higher likelihood of time stress compared with not completing high school. Time stress is associated with worse mental health, worse self-rated health, less physical activity and lower life satisfaction.</p>
    </div>

    <div class="subsection">
      <div class="subsection-title">Ask yourself · Ask your team</div>
      <div class="compare">
        <div class="c-col">
          <h3 style="color:var(--navy);">Ask yourself</h3>
          <div class="c-row">Where do you currently put most of your energy?</div>
          <div class="c-row">What might you need to do in order to work more in the High Importance, Low Urgency quadrant?</div>
        </div>
        <div class="c-col">
          <h3 style="color:var(--navy);">Ask your team</h3>

          <div class="c-row">Discuss where the team is putting its energy and what you may need to do to work more in the High Importance, Low Urgency quadrant.</div>
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════
   CORE ENGINE
   ═══════════════════════════════════════════════════════════ */
function render() { renderNav(); renderContent(); }

function renderNav() {
  document.getElementById('nav').innerHTML = sections.map(s =>
    `<div class="nav-item ${s.id === state.currentSection ? 'active' : ''}" onclick="goTo('${s.id}')">
      <span class="nav-number">${s.id}</span> ${s.icon} ${s.name}
    </div>`
  ).join('');
}

function goTo(id) { state.currentSection = id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function renderContent() {
  const c = document.getElementById('content');
  switch(state.currentSection) {
    case sections[0].id: c.innerHTML = render31();   break;
    case sections[1].id: c.innerHTML = render32();   break;
    case sections[2].id: c.innerHTML = render33();   break;
    case sections[3].id: c.innerHTML = render34();   break;
    case sections[4].id: c.innerHTML = render35();   break;
    case sections[5].id: c.innerHTML = render36();   break;
    case 'quiz':         c.innerHTML = renderQuiz(); break;
  }
}

function renderQuiz() {
  if (state.quizComplete) {
    const score = state.quizAnswers.filter((a, i) => a === quizQuestions[i].correct).length;
    const pct   = Math.round((score / quizQuestions.length) * 100);
    const emoji = pct === 100 ? '🏆' : pct >= 75 ? '⭐' : pct >= 50 ? '👍' : '📚';
    const msg   = pct === 100 ? 'Perfect! You\'ve mastered this material.' :
                  pct >= 75  ? 'Great work! You understand the key concepts.' :
                  pct >= 50  ? 'Good effort — revisit the sections you found tricky.' :
                               'Keep studying and try again!';
    return `
      <div class="quiz-result">
        <div class="section-number">Quiz</div>
        <div class="section-title" style="display:block;margin-bottom:16px;">Results</div>
        <div class="quiz-score">${emoji}</div>
        <p style="font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px;">${score} / ${quizQuestions.length} (${pct}%)</p>
        <p class="quiz-message">${msg}</p>
        <button class="quiz-btn quiz-btn-primary" onclick="resetQuiz()">Try Again</button>
      </div>`;
  }
  const q        = quizQuestions[state.quiz];
  const answered = state.quizAnswers[state.quiz] !== undefined;
  const isCorrect = answered && state.quizAnswers[state.quiz] === q.correct;
  return `
    <div class="section-number">Quiz</div>
    <div class="section-title" style="display:block;margin-bottom:16px;">Test Your Knowledge</div>
    <div class="quiz-progress">
      ${quizQuestions.map((_, i) => {
        let cls = i === state.quiz ? 'active' : '';
        if (state.quizAnswers[i] !== undefined)
          cls = state.quizAnswers[i] === quizQuestions[i].correct ? 'correct' : 'incorrect';
        return `<div class="quiz-dot ${cls}"></div>`;
      }).join('')}
    </div>
    <div class="quiz-question">Q${state.quiz + 1}. ${q.q}</div>
    <div class="quiz-options">
      ${q.opts.map((opt, i) => {
        let cls = answered ? 'disabled ' : '';
        if (answered && i === q.correct) cls += 'correct';
        else if (answered && state.quizAnswers[state.quiz] === i) cls += 'incorrect';
        return `<div class="quiz-option ${cls}" onclick="${answered ? '' : `answerQuiz(${i})`}">${opt}</div>`;
      }).join('')}
    </div>
    ${answered ? `<div class="quiz-feedback ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '✅ Correct!' : '❌ Not quite.'} ${q.explain}</div>` : ''}
    <div class="quiz-nav">
      ${state.quiz > 0 ? '<button class="quiz-btn quiz-btn-secondary" onclick="prevQuiz()">← Previous</button>' : ''}
      ${answered ? (state.quiz < quizQuestions.length - 1
        ? '<button class="quiz-btn quiz-btn-primary" onclick="nextQuiz()">Next →</button>'
        : '<button class="quiz-btn quiz-btn-primary" onclick="finishQuiz()">See Results</button>') : ''}
    </div>`;
}

function answerQuiz(i) { state.quizAnswers[state.quiz] = i; renderContent(); }
function prevQuiz()    { state.quiz--; renderContent(); }
function nextQuiz()    { state.quiz++; renderContent(); }
function finishQuiz()  { state.quizComplete = true; renderContent(); }
function resetQuiz()   { state.quiz = 0; state.quizAnswers = []; state.quizComplete = false; renderContent(); }

/* Expandable cards in 3.6 */
document.addEventListener('click', function(e) {
  const card = e.target.closest('.exp-card');
  if (card) card.classList.toggle('expanded');
});

render();
</script>
